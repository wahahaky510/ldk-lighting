<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真トーナメント投票</title>
<style>
  :root{
    --bg:#0f1220; --panel:#1a1f36; --panel2:#232a4a; --line:#333c66;
    --text:#eef1fb; --muted:#9aa3c7; --accent:#6c8cff; --accent2:#ff7ab6;
    --win:#4ade80; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:linear-gradient(160deg,#0b0e1a,#141830 60%,#1a1130);
    color:var(--text); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    min-height:100vh; padding:24px 16px;
  }
  .wrap{max-width:1000px; margin:0 auto}
  header{text-align:center; margin-bottom:20px}
  h1{font-size:clamp(22px,4vw,34px); margin:0 0 6px; letter-spacing:.02em}
  .sub{color:var(--muted); font-size:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow)}
  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:12px; padding:12px 20px;
    font-size:15px; font-weight:700; color:#fff; background:var(--accent);
    transition:transform .08s ease, filter .2s ease;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--panel2); border:1px solid var(--line)}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:600; padding:8px 14px; font-size:13px}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center}
  .drop{
    border:2px dashed var(--line); border-radius:16px; padding:40px 20px; text-align:center;
    transition:border-color .2s, background .2s; cursor:pointer;
  }
  .drop.hover{border-color:var(--accent); background:rgba(108,140,255,.08)}
  .drop .big{font-size:42px; margin-bottom:8px}
  .hint{color:var(--muted); font-size:13px; margin-top:8px}
  .thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px; margin-top:18px}
  .thumb{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--line)}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb .x{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; cursor:pointer; font-size:14px; line-height:22px}
  .count{color:var(--muted); font-size:14px; margin-top:10px; text-align:center}

  /* Match */
  .match{display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:stretch; margin-top:20px}
  .contender{background:var(--panel2); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    cursor:pointer; transition:transform .12s ease, box-shadow .2s ease, border-color .2s;}
  .contender:hover{transform:translateY(-4px); box-shadow:0 14px 34px rgba(108,140,255,.35); border-color:var(--accent)}
  .contender.chosen{border-color:var(--win); box-shadow:0 0 0 3px rgba(74,222,128,.4)}
  .contender .frame{width:100%; aspect-ratio:4/3; background:#000; display:flex; align-items:center; justify-content:center}
  .contender .frame img{width:100%; height:100%; object-fit:contain}
  .contender .cap{padding:12px; text-align:center; font-weight:700}
  .vs{align-self:center; font-size:28px; font-weight:900; color:var(--accent2); text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .progress{height:10px; background:var(--panel2); border-radius:999px; overflow:hidden; margin:16px 0 6px}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s ease}
  .status{text-align:center; color:var(--muted); font-size:14px}
  .roundtag{display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px}

  /* Winner */
  .winner{text-align:center}
  .crown{font-size:54px}
  .winner .frame{max-width:520px; margin:14px auto; aspect-ratio:4/3; background:#000; border-radius:16px; overflow:hidden;
    border:2px solid var(--win); box-shadow:0 0 40px rgba(74,222,128,.4); display:flex; align-items:center; justify-content:center}
  .winner .frame img{width:100%; height:100%; object-fit:contain}
  .center{text-align:center}
  .mt{margin-top:16px}
  .hidden{display:none}

  /* Mode selection */
  .modebox{margin-top:20px; border-top:1px solid var(--line); padding-top:18px}
  .modehd{font-weight:700; margin-bottom:12px; text-align:center; color:var(--muted); font-size:13px; letter-spacing:.06em}
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .mode{display:block; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; transition:border-color .2s, box-shadow .2s}
  .mode:hover{border-color:var(--accent)}
  .mode.selected{border-color:var(--accent); box-shadow:0 0 0 2px rgba(108,140,255,.35)}
  .mode input{display:none}
  .mtitle{font-weight:800; margin-bottom:6px}
  .mdesc{color:var(--muted); font-size:13px; line-height:1.5}
  .eloopts{margin-top:12px; text-align:center; font-size:14px}
  .eloopts select{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin-left:6px}
  .sharebanner{margin-top:14px; padding:12px 14px; border-radius:12px; text-align:center; font-size:14px;
    background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.5); color:var(--text)}
  @media(max-width:640px){ .modes{grid-template-columns:1fr} }

  /* Ranking list */
  .ranklist{display:flex; flex-direction:column; gap:10px; margin-top:16px}
  .rankrow{display:grid; grid-template-columns:44px 60px 1fr auto; gap:12px; align-items:center;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
  .rankrow.top1{border-color:var(--win); box-shadow:0 0 0 2px rgba(74,222,128,.35)}
  .rk{font-size:20px; font-weight:900; text-align:center; color:var(--accent2)}
  .rankrow img{width:60px; height:46px; object-fit:cover; border-radius:8px; display:block}
  .rname{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rstat{color:var(--muted); font-size:13px; text-align:right; white-space:nowrap}
  .rstat b{color:var(--text); font-size:15px}
  @media(max-width:640px){
    .match{grid-template-columns:1fr; }
    .vs{transform:rotate(90deg)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📸 写真トーナメント投票</h1>
    <div class="sub">たくさんの写真から、1対1の投票で「優勝写真」を決めよう</div>
  </header>

  <!-- SETUP -->
  <section id="setup" class="card">
    <div id="drop" class="drop">
      <div class="big">🖼️</div>
      <div><b>写真をドラッグ＆ドロップ</b> するか、クリックして選択</div>
      <div class="hint">複数選択OK・JPEG / PNG / WebP など・画像はブラウザ内だけで処理され外部送信されません</div>
      <input id="file" type="file" accept="image/*" multiple class="hidden">
    </div>
    <div id="thumbs" class="thumbs"></div>
    <div id="count" class="count"></div>

    <div class="modebox">
      <div class="modehd">投票方式を選ぶ</div>
      <div class="modes">
        <label class="mode selected" data-mode="ko">
          <input type="radio" name="mode" value="ko" checked>
          <div class="mtitle">🏆 勝ち抜きトーナメント</div>
          <div class="mdesc">1対1で負けたら即敗退。試合数が少なく手軽（枚数−1試合）。組み合わせ運の影響あり。</div>
        </label>
        <label class="mode" data-mode="elo">
          <input type="radio" name="mode" value="elo">
          <div class="mtitle">📊 総当たり風ランキング（ELO）</div>
          <div class="mdesc">近いレート同士で複数試合。全体の順位・レート・勝率が出て公平性が高い。</div>
        </label>
      </div>
      <div id="eloOpts" class="eloopts hidden">
        <label>1枚あたりの試合数の目安：
          <select id="roundSel">
            <option value="3">少なめ（3ラウンド）</option>
            <option value="5" selected>標準（5ラウンド）</option>
            <option value="8">多め（8ラウンド・より正確）</option>
          </select>
        </label>
        <div class="hint" id="eloEst"></div>
      </div>
    </div>

    <div class="row mt">
      <button id="clear" class="btn ghost">すべて削除</button>
      <button id="export" class="btn secondary" disabled>📤 共有用に書き出す</button>
      <button id="start" class="btn" disabled>開始</button>
    </div>
    <div id="exportHint" class="hint" style="text-align:center">
      「共有用に書き出す」＝写真を埋め込んだHTMLファイルを保存。スマホや家族に送れば、同じ写真で投票できます（オフライン可・アカウント不要）。
    </div>
    <div id="shareBanner" class="sharebanner hidden">
      📥 共有されたファイルを開いています。下の写真セットでそのままトーナメントを始められます。
    </div>
  </section>

  <!-- MATCH -->
  <section id="arena" class="card hidden">
    <div class="center"><span id="roundtag" class="roundtag"></span></div>
    <div class="progress"><i id="bar"></i></div>
    <div id="status" class="status"></div>
    <div class="match">
      <div id="cA" class="contender">
        <div class="frame"><img id="imgA" alt="候補A"></div>
        <div class="cap" id="capA"></div>
      </div>
      <div class="vs">VS</div>
      <div id="cB" class="contender">
        <div class="frame"><img id="imgB" alt="候補B"></div>
        <div class="cap" id="capB"></div>
      </div>
    </div>
    <div class="row mt">
      <button id="reset1" class="btn ghost">中止して最初から</button>
    </div>
  </section>

  <!-- WINNER -->
  <section id="result" class="card winner hidden">
    <div class="crown">👑</div>
    <div class="roundtag">優勝</div>
    <div class="frame"><img id="winImg" alt="優勝写真"></div>
    <div id="winName" style="font-weight:800; font-size:18px"></div>
    <div id="winMeta" class="status mt"></div>
    <div class="row mt">
      <button id="again" class="btn secondary">同じ写真でもう一度</button>
      <button id="reset2" class="btn">新しく作り直す</button>
    </div>
  </section>

  <!-- RANKING RESULT -->
  <section id="ranking" class="card hidden">
    <div class="center"><span class="roundtag">最終ランキング（ELOレーティング）</span></div>
    <div id="rankList" class="ranklist"></div>
    <div class="row mt">
      <button id="againR" class="btn secondary">同じ写真でもう一度</button>
      <button id="resetR" class="btn">新しく作り直す</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  // ---- 状態 ----
  var photos = [];            // {id, url, name}
  var idSeq = 0;
  var bracket = null;         // トーナメント状態

  var elo = null;             // ELOランキング状態
  var mode = "ko";            // "ko" | "elo"

  var $ = function(id){ return document.getElementById(id); };
  var setup=$("setup"), arena=$("arena"), result=$("result"), ranking=$("ranking");
  var drop=$("drop"), fileInput=$("file"), thumbs=$("thumbs"), countEl=$("count"), startBtn=$("start");

  // ---- 画像追加 ----
  function addFiles(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){ return /^image\//.test(f.type); });
    files.forEach(function(f){
      var url = URL.createObjectURL(f);
      photos.push({ id: ++idSeq, url: url, name: f.name.replace(/\.[^.]+$/,"") });
    });
    renderThumbs();
  }

  function renderThumbs(){
    thumbs.innerHTML = "";
    photos.forEach(function(p){
      var d = document.createElement("div");
      d.className = "thumb";
      var img = document.createElement("img"); img.src = p.url; img.alt = p.name;
      var x = document.createElement("button"); x.className="x"; x.textContent="×"; x.title="削除";
      x.onclick = function(){
        URL.revokeObjectURL(p.url);
        photos = photos.filter(function(q){ return q.id !== p.id; });
        renderThumbs();
      };
      d.appendChild(img); d.appendChild(x); thumbs.appendChild(d);
    });
    countEl.textContent = photos.length + " 枚の写真" +
      (photos.length < 2 ? "（開始には2枚以上必要です）" : "");
    startBtn.disabled = photos.length < 2;
    $("export").disabled = photos.length < 1;
    updateEstimate();
  }

  // ---- モード選択 ----
  function updateEstimate(){
    var r = parseInt($("roundSel").value, 10);
    var games = Math.round(photos.length * r / 2);
    $("eloEst").textContent = photos.length >= 2
      ? "予想試合数：約 " + games + " 試合（" + photos.length + "枚 × " + r + "ラウンド ÷ 2）"
      : "";
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'), function(radio){
    radio.addEventListener("change", function(){
      mode = radio.value;
      Array.prototype.forEach.call(document.querySelectorAll(".mode"), function(m){
        m.classList.toggle("selected", m.getAttribute("data-mode") === mode);
      });
      $("eloOpts").classList.toggle("hidden", mode !== "elo");
      startBtn.textContent = mode === "elo" ? "ランキング開始" : "トーナメント開始";
    });
  });
  $("roundSel").addEventListener("change", updateEstimate);

  // ドラッグ＆ドロップ / クリック
  drop.addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(e){ addFiles(e.target.files); fileInput.value=""; });
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("hover"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("hover"); });
  });
  drop.addEventListener("drop", function(e){ if(e.dataTransfer) addFiles(e.dataTransfer.files); });

  $("clear").onclick = function(){
    photos.forEach(function(p){ URL.revokeObjectURL(p.url); });
    photos = []; renderThumbs();
  };

  // ---- トーナメント ----
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function startTournament(){
    var players = shuffle(photos.slice());
    bracket = {
      current: players,   // 今ラウンドの候補（byeは即通過）
      next: [],           // 次ラウンドへ勝ち上がった候補
      idx: 0,             // current内の対戦ペア先頭index
      roundNo: 1,
      totalRounds: Math.ceil(Math.log2(players.length)),
      matchDone: 0,
      matchTotal: players.length - 1  // 単勝抜けは総試合数 = 人数-1
    };
    show(arena);
    nextMatch();
  }

  function roundName(remaining){
    if(remaining === 2) return "決勝";
    if(remaining === 4) return "準決勝";
    if(remaining === 8) return "準々決勝";
    return remaining + "人 ラウンド (ラウンド" + bracket.roundNo + ")";
  }

  function nextMatch(){
    // 現ラウンドを消化しきったら次ラウンドへ
    if(bracket.idx >= bracket.current.length){
      bracket.current = bracket.next;
      bracket.next = [];
      bracket.idx = 0;
      bracket.roundNo++;
    }
    // 優勝決定
    if(bracket.current.length === 1){
      finish(bracket.current[0]);
      return;
    }
    // bye（残り1つだけ余る場合）は自動的に次へ
    if(bracket.idx === bracket.current.length - 1){
      bracket.next.push(bracket.current[bracket.idx]);
      bracket.idx++;
      nextMatch();
      return;
    }

    var a = bracket.current[bracket.idx];
    var b = bracket.current[bracket.idx+1];

    $("roundtag").textContent = roundName(bracket.current.length);
    var pct = bracket.matchTotal ? Math.round(bracket.matchDone / bracket.matchTotal * 100) : 0;
    $("bar").style.width = pct + "%";
    $("status").textContent = "第 " + (bracket.matchDone+1) + " 試合 / 全 " + bracket.matchTotal + " 試合　—　勝った方をクリックして投票";

    $("imgA").src = a.url; $("capA").textContent = a.name || "候補A";
    $("imgB").src = b.url; $("capB").textContent = b.name || "候補B";
    $("cA").classList.remove("chosen"); $("cB").classList.remove("chosen");

    $("cA").onclick = function(){ vote(a, "cA"); };
    $("cB").onclick = function(){ vote(b, "cB"); };
  }

  function vote(winner, elId){
    $("cA").onclick = null; $("cB").onclick = null;  // 二重投票防止
    $(elId).classList.add("chosen");
    bracket.next.push(winner);
    bracket.idx += 2;
    bracket.matchDone++;
    setTimeout(nextMatch, 260);
  }

  function finish(champ){
    $("bar").style.width = "100%";
    $("winImg").src = champ.url;
    $("winName").textContent = champ.name || "優勝写真";
    $("winMeta").textContent = photos.length + " 枚の中から、" + bracket.matchTotal + " 試合を勝ち抜きました 🎉";
    show(result);
  }

  // ---- ELOランキング方式 ----
  var K = 32; // レート変動係数（一般的な標準値）

  function startElo(){
    var rounds = parseInt($("roundSel").value, 10);
    elo = {
      players: photos.map(function(p){
        return { photo:p, rating:1000, win:0, loss:0, seen:{} };
      }),
      matches: [],   // 生成済みの対戦キュー
      idx: 0
    };
    buildEloMatches(rounds);
    show(arena);
    nextEloMatch();
  }

  // スイス式：各ラウンドでレート順に近い相手と当てる
  function buildEloMatches(rounds){
    for(var r=0; r<rounds; r++){
      var pool = elo.players.slice();
      // 初回はランダム、以降はレート順に整列
      if(r===0) shuffle(pool);
      else pool.sort(function(a,b){ return b.rating - a.rating; });

      var used = {};
      for(var i=0; i<pool.length; i++){
        var a = pool[i];
        if(used[a.photo.id]) continue;
        // まだ当たっていない最も近い相手を探す
        var partner = null;
        for(var j=i+1; j<pool.length; j++){
          var b = pool[j];
          if(used[b.photo.id]) continue;
          if(!a.seen[b.photo.id]){ partner = b; break; }
          if(!partner) partner = b; // 全員対戦済みなら最も近い相手で妥協
        }
        if(!partner) continue;
        used[a.photo.id] = true; used[partner.photo.id] = true;
        a.seen[partner.photo.id] = true; partner.seen[a.photo.id] = true;
        elo.matches.push([a, partner]);
      }
    }
    shuffleLightly(elo.matches);
  }

  // 隣接だけ軽くシャッフル（同じ写真が連続しにくくする）
  function shuffleLightly(m){
    for(var i=0;i<m.length-1;i++){
      var a=m[i];
      if(m[i+1] && (m[i+1][0]===a[0]||m[i+1][0]===a[1]||m[i+1][1]===a[0]||m[i+1][1]===a[1])){
        for(var j=i+2;j<m.length;j++){
          if(m[j][0]!==a[0]&&m[j][0]!==a[1]&&m[j][1]!==a[0]&&m[j][1]!==a[1]){
            var t=m[i+1]; m[i+1]=m[j]; m[j]=t; break;
          }
        }
      }
    }
  }

  function nextEloMatch(){
    if(elo.idx >= elo.matches.length){ finishElo(); return; }
    var pair = elo.matches[elo.idx];
    var a = pair[0], b = pair[1];

    $("roundtag").textContent = "レーティング対戦";
    var pct = Math.round(elo.idx / elo.matches.length * 100);
    $("bar").style.width = pct + "%";
    $("status").textContent = "第 " + (elo.idx+1) + " 試合 / 全 " + elo.matches.length + " 試合　—　良いと思う方をクリック";

    $("imgA").src = a.photo.url; $("capA").textContent = a.photo.name || "候補A";
    $("imgB").src = b.photo.url; $("capB").textContent = b.photo.name || "候補B";
    $("cA").classList.remove("chosen"); $("cB").classList.remove("chosen");

    $("cA").onclick = function(){ eloVote(a, b, "cA"); };
    $("cB").onclick = function(){ eloVote(b, a, "cB"); };
  }

  function eloVote(winner, loser, elId){
    $("cA").onclick = null; $("cB").onclick = null;
    $(elId).classList.add("chosen");
    // ELO更新
    var ea = 1 / (1 + Math.pow(10, (loser.rating - winner.rating)/400));
    var eb = 1 - ea;
    winner.rating += K * (1 - ea);
    loser.rating  += K * (0 - eb);
    winner.win++; loser.loss++;
    elo.idx++;
    setTimeout(nextEloMatch, 220);
  }

  function finishElo(){
    var ranked = elo.players.slice().sort(function(a,b){ return b.rating - a.rating; });
    var list = $("rankList");
    list.innerHTML = "";
    ranked.forEach(function(p, i){
      var games = p.win + p.loss;
      var rate = games ? Math.round(p.win / games * 100) : 0;
      var row = document.createElement("div");
      row.className = "rankrow" + (i===0 ? " top1" : "");
      row.innerHTML =
        '<div class="rk">' + (i===0?"👑":(i+1)) + '</div>' +
        '<img alt="">' +
        '<div class="rname"></div>' +
        '<div class="rstat"><b>' + Math.round(p.rating) + '</b> pt<br>' +
          p.win + '勝' + p.loss + '敗（勝率' + rate + '%）</div>';
      row.querySelector("img").src = p.photo.url;
      row.querySelector(".rname").textContent = p.photo.name || ("写真" + (i+1));
      list.appendChild(row);
    });
    show(ranking);
  }

  // ---- 画面切替 ----
  function show(sec){
    [setup, arena, result, ranking].forEach(function(s){ s.classList.add("hidden"); });
    sec.classList.remove("hidden");
    window.scrollTo({top:0, behavior:"smooth"});
  }

  // ---- 共有用ファイルの書き出し（写真を埋め込み） ----
  function blobUrlToDataURL(url){
    return fetch(url).then(function(r){ return r.blob(); }).then(function(b){
      return new Promise(function(res, rej){
        var fr = new FileReader();
        fr.onload = function(){ res(fr.result); };
        fr.onerror = rej;
        fr.readAsDataURL(b);
      });
    });
  }

  function exportShareable(){
    var btn = $("export");
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "書き出し中…";
    Promise.all(photos.map(function(p){
      // data URL はそのまま、blob URL は変換
      if(/^data:/.test(p.url)) return Promise.resolve({ name:p.name, data:p.url });
      return blobUrlToDataURL(p.url).then(function(d){ return { name:p.name, data:d }; });
    })).then(function(items){
      var clone = document.documentElement.cloneNode(true);
      var t = clone.querySelector("#thumbs"); if(t) t.innerHTML = "";
      var old = clone.querySelector("#preload"); if(old) old.parentNode.removeChild(old);
      // 開始時に見えている画面をリセット（setupだけ表示）
      ["arena","result","ranking"].forEach(function(id){
        var el = clone.querySelector("#"+id); if(el && el.className.indexOf("hidden")<0) el.className += " hidden";
      });
      var s = clone.ownerDocument.createElement("script");
      s.id = "preload";
      s.textContent = "window.__PRELOAD__=" + JSON.stringify(items) + ";";
      clone.querySelector("head").appendChild(s);
      var html = "<!DOCTYPE html>\n" + clone.outerHTML;
      var blob = new Blob([html], { type:"text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "写真トーナメント_共有用.html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      btn.disabled = false; btn.textContent = label;
    }).catch(function(){
      alert("書き出しに失敗しました。写真を読み込み直してもう一度お試しください。");
      btn.disabled = false; btn.textContent = label;
    });
  }
  $("export").onclick = exportShareable;

  // 共有ファイルとして開かれたとき：埋め込み写真を読み込む
  if(window.__PRELOAD__ && window.__PRELOAD__.length){
    window.__PRELOAD__.forEach(function(it){
      photos.push({ id: ++idSeq, url: it.data, name: it.name });
    });
    $("shareBanner").classList.remove("hidden");
  }

  function begin(){ if(mode === "elo") startElo(); else startTournament(); }
  startBtn.onclick = begin;
  $("reset1").onclick = function(){ show(setup); };
  $("reset2").onclick = function(){ show(setup); };
  $("again").onclick = begin;
  $("againR").onclick = begin;
  $("resetR").onclick = function(){ show(setup); };

  renderThumbs();
})();
</script>
</body>
</html>
